[project]
name = "infergrid-experiment-tracker"
version = "0.1.0"
description = "Experiment tracking API for InferGrid"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.111.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
