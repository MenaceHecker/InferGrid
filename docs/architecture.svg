<svg width="680" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:Arial,sans-serif">

<!-- Client -->
<rect x="270" y="20" width="140" height="40" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="45" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2c2a">Client</text>

<!-- GKE infergrid namespace -->
<rect x="20" y="80" width="450" height="380" rx="14" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="6 4"/>
<text x="32" y="98" font-size="11" fill="#888780">GKE — infergrid namespace</text>

<!-- Inference API -->
<rect x="140" y="110" width="200" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text x="240" y="135" text-anchor="middle" font-size="13" font-weight="500" fill="#3c3489">Inference API</text>
<text x="240" y="153" text-anchor="middle" font-size="11" fill="#534ab7">FastAPI · /predict /health /ready</text>

<!-- Experiment Tracker -->
<rect x="36" y="220" width="168" height="56" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="120" y="244" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Experiment Tracker</text>
<text x="120" y="262" text-anchor="middle" font-size="11" fill="#0f6e56">A/B config · model registry</text>

<!-- Kafka -->
<rect x="268" y="220" width="162" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<text x="349" y="244" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">Kafka</text>
<text x="349" y="262" text-anchor="middle" font-size="11" fill="#854f0b">model-a · model-b topics</text>

<!-- Consumer Worker -->
<rect x="268" y="330" width="162" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<text x="349" y="354" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">Consumer Worker</text>
<text x="349" y="372" text-anchor="middle" font-size="11" fill="#854f0b">inference · result write</text>

<!-- Redis -->
<rect x="36" y="330" width="162" height="56" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
<text x="117" y="354" text-anchor="middle" font-size="13" font-weight="500" fill="#711b13">Redis</text>
<text x="117" y="372" text-anchor="middle" font-size="11" fill="#993c1d">job results · TTL 5 min</text>

<!-- PostgreSQL -->
<rect x="36" y="430" width="162" height="40" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="117" y="455" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">PostgreSQL</text>

<!-- monitoring namespace -->
<rect x="488" y="80" width="172" height="380" rx="14" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="6 4"/>
<text x="500" y="98" font-size="11" fill="#888780">monitoring</text>

<!-- Prometheus -->
<rect x="500" y="110" width="148" height="40" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text x="574" y="135" text-anchor="middle" font-size="13" font-weight="500" fill="#0c447c">Prometheus</text>

<!-- Grafana -->
<rect x="500" y="190" width="148" height="40" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text x="574" y="215" text-anchor="middle" font-size="13" font-weight="500" fill="#0c447c">Grafana</text>

<!-- Drift Detector -->
<rect x="500" y="270" width="148" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text x="574" y="294" text-anchor="middle" font-size="13" font-weight="500" fill="#0c447c">Drift Detector</text>
<text x="574" y="312" text-anchor="middle" font-size="11" fill="#185fa5">KS-test every 60s</text>

<!-- HPA -->
<rect x="500" y="366" width="148" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
<text x="574" y="390" text-anchor="middle" font-size="13" font-weight="500" fill="#0c447c">HPA + Adapter</text>
<text x="574" y="408" text-anchor="middle" font-size="11" fill="#185fa5">1-6 replicas on RPS</text>

<!-- Arrows -->
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#b4b2a9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Client -> Inference API -->
<line x1="340" y1="60" x2="278" y2="110" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
<text x="322" y="90" text-anchor="middle" font-size="10" fill="#888780">POST /predict</text>

<!-- Inference API -> Experiment Tracker -->
<path d="M190 166 L190 196 L120 196 L120 220" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
<text x="146" y="192" font-size="10" fill="#888780">GET /ab/active</text>

<!-- Inference API -> Kafka -->
<line x1="316" y1="166" x2="340" y2="220" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
<text x="356" y="200" font-size="10" fill="#888780">async path</text>

<!-- Kafka -> Consumer -->
<line x1="349" y1="276" x2="349" y2="330" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

<!-- Consumer -> Redis -->
<line x1="268" y1="362" x2="198" y2="362" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
<text x="232" y="354" text-anchor="middle" font-size="10" fill="#888780">result</text>

<!-- Redis -> Inference API -->
<path d="M117 330 L117 196 L140 196 L140 166" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
<text x="84" y="256" font-size="10" fill="#888780">/ws/result</text>

<!-- Experiment Tracker -> PostgreSQL -->
<line x1="120" y1="276" x2="117" y2="430" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

<!-- Inference API scrape arrow -->
<path d="M340 138 L468 138 L468 130 L500 130" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
<text x="462" y="126" text-anchor="end" font-size="10" fill="#b4b2a9">scrape</text>

<!-- Grafana -> Prometheus -->
<line x1="574" y1="190" x2="574" y2="150" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arr2)"/>

<!-- Drift -> Prometheus -->
<line x1="574" y1="270" x2="574" y2="230" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arr2)"/>

<!-- HPA -> Inference API -->
<path d="M500 394 L468 394 L468 138 L340 138" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
<text x="462" y="412" text-anchor="end" font-size="10" fill="#b4b2a9">scales</text>

<!-- Legend -->
<line x1="36" y1="490" x2="66" y2="490" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>
<text x="72" y="494" font-size="11" fill="#888780">request / data flow</text>
<line x1="220" y1="490" x2="250" y2="490" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="256" y="494" font-size="11" fill="#888780">scrape / scale signal</text>

</svg>
