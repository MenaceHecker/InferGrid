# async-queue/kafka/values.yaml
# Bitnami Kafka Helm chart values for InferGrid.
# Install with:
#   helm repo add bitnami https://charts.bitnami.com/bitnami
#   helm repo update
#   helm install kafka bitnami/kafka \
#     --namespace infergrid \
#     --values async-queue/kafka/values.yaml

global:
  security:
    # The Bitnami 4.0.0 image was moved from bitnami/ to bitnamilegacy/.
    allowInsecureImages: true

image:
  repository: bitnamilegacy/kafka
  tag: 4.0.0-debian-12-r10

# KRaft mode (no ZooKeeper dependency, default in recent Bitnami chart)
kraft:
  enabled: true

listeners:
  client:
    protocol: PLAINTEXT   # no TLS for internal cluster traffic
  controller:
    protocol: PLAINTEXT

# A single combined controller/broker is enough for portfolio scale.
controller:
  replicaCount: 1
  controllerOnly: false
  overrideConfiguration:
    default.replication.factor: 1
    min.insync.replicas: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.min.isr: 1
    transaction.state.log.replication.factor: 1
  persistence:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

broker:
  replicaCount: 0

# Expose inside the cluster only
service:
  type: ClusterIP

# Pre-create topics on startup
provisioning:
  enabled: true
  topics:
    - name: infergrid.model-a.requests
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"    # 1 hour retention
        max.message.bytes: "1048576"
    - name: infergrid.model-b.requests
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
        max.message.bytes: "1048576"
