apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: infergrid
  labels:
    app: inference-api
    layer: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime deploys
  template:
    metadata:
      labels:
        app: inference-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: inference-api
          image: gcr.io/YOUR_PROJECT_ID/inference-api:latest   # replaced by CI
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: inference-api-config
                  key: MODEL_PATH
            - name: MODEL_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: inference-api-config
                  key: MODEL_BACKEND
            - name: MAX_CONCURRENT_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: inference-api-config
                  key: MAX_CONCURRENT_REQUESTS
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: inference-api-config
                  key: REDIS_URL
            - name: WS_POLL_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: inference-api-config
                  key: WS_POLL_INTERVAL_SECONDS
            - name: WS_POLL_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: inference-api-config
                  key: WS_POLL_TIMEOUT_SECONDS
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-api-secret
                  key: API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            # Is the process alive? Restart if /health stops returning 200.
            # Does NOT check model, a hung process with a loaded model
            # should still be restarted.
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            # Is the pod ready to serve traffic? Only passes when the model
            # is loaded AND a test inference completes within 500ms.
            # Kubernetes will not send traffic until this passes.
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1      # enforces the 500ms inference budget + margin
      terminationGracePeriodSeconds: 30
