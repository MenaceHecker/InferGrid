apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-api-config
  namespace: infergrid
data:
  MODEL_PATH: "/app/models/newsgroups_model.pkl"
  MODEL_BACKEND: "sklearn"
  MAX_CONCURRENT_REQUESTS: "10"
  LOG_LEVEL: "info"
  EXPERIMENT_TRACKER_URL: "http://experiment-tracker.infergrid.svc.cluster.local:8001"
  EXPERIMENT_TRACKER_TIMEOUT: "0.5"
  REDIS_URL: "redis://redis.infergrid.svc.cluster.local:6379"
  WS_POLL_INTERVAL_SECONDS: "0.5"
  WS_POLL_TIMEOUT_SECONDS: "30"