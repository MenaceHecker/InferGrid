# service-loadbalancer.yaml
# Would use this on GKE instead of service-nodeport.yaml (kind local dev).
# The static IP is provisioned by Terraform (google_compute_address).
# Get the IP from: terraform output inference_api_ip

apiVersion: v1
kind: Service
metadata:
  name: inference-api
  namespace: infergrid
spec:
  selector:
    app: inference-api
  type: LoadBalancer
  loadBalancerIP: "35.255.145.27"
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
