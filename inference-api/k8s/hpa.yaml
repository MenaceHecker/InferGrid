apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-api
  namespace: infergrid
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-api

  # Spec says 1–6 replicas
  minReplicas: 1
  maxReplicas: 6

  metrics:
    # Primary signal: requests-per-second from Prometheus.
    # Target of 50 RPS per pod means:
    #   about at  50 RPS total = 1 pod
    #   about at 150 RPS total = 3 pods
    #   about at 300 RPS total = 6 pods (ceiling)
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "50"

    # Secondary signal: CPU. Guards against compute-heavy requests
    # that don't show up as high RPS (e.g. long text, ONNX inference).
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30   # react quickly to traffic spikes
      policies:
        - type: Pods
          value: 2                      # add at most 2 pods per scale event
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 180  # wait 3 min before scaling down
      policies:
        - type: Pods
          value: 1                      # remove at most 1 pod per scale event
          periodSeconds: 60